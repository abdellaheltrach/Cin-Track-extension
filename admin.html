<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CinéTrack</title>

  <!-- Tailwind CSS v4 -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- roboto font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />

  <!-- Configure Roboto as the default sans/body font in Tailwind v4 -->
  <style>
    body {
      font-family: "Roboto", sans-serif;
    }
  </style>
</head>

<body class="bg-[#121214] text-white font-sans">
  <header
    class="max-w-7xl mx-auto px-2 border-b-2 mb-[8px] border-[#35353d] h-[80px] flex flex-row justify-between items-center">
    <a href="/index.html">
      <img class="h-[80px] block md:hidden" src="/img/Phone Logo.png" alt="page logo" />

      <img class="w-[250px] h-[80px] hidden md:block" src="/img/Logo.png" alt="page logo" />
    </a>
    <button
      class="cursor-pointer p-2 w-12 h-12 flex items-center justify-center rounded-full hover:bg-[#383840]/20 transition-colors">
      <svg class="border-2 border-white rounded-full h-9 w-9 p-1 text-white" xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
        <circle cx="12" cy="7" r="4" />
      </svg>
    </button>
  </header>
  <div class="max-w-7xl mx-auto px-2 grid grid-cols-1 lg:grid-cols-12 gap-4 min-h-[calc(100vh-88px)]">
    <main class="lg:col-span-12 py-4">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl">Gestion du catalogue</h1>
        <button id="add-btn" class="px-3 text-white hover:bg-[#35353d] bg-green-600 p-1.5 rounded-lg transition-colors cursor-pointer">Ajouter</button>
      </div>
      <!-- message -->
      <div id="feedback-banner" class="hidden mb-6 px-4 py-3 rounded-lg text-sm border"></div>

      <div id="status-message" class="hidden text-center py-8 text-lg"></div>

      <div id="table-container" class="overflow-x-auto bg-[#1c1c20] rounded-lg border border-[#35353d] hidden">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-[#35353d] bg-[#25252b] text-gray-300 text-sm uppercase">
              <th class="py-3 px-4">Image</th>
              <th class="py-3 px-4">Titre</th>
              <th class="py-3 px-4">Type</th>
              <th class="py-3 px-4">Année</th>
              <th class="py-3 px-4 text-right md:pr-20 lg:pr-20">Actions</th>
            </tr>
          </thead>
          <tbody id="table-body" class="divide-y divide-[#35353d]">
          </tbody>
        </table>
      </div>
    </main>
  </div>


  <!-- model -->
  <div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-[#121214]/70 backdrop-blur"
    onclick="closeModel()">
    <div class="relative bg-[#27272c] border border-[#35353d] rounded-2xl w-full max-w-[800px] p-6 mx-4"
      id="modal-content" onclick="event.stopPropagation()">
      <button id="closeModalBtn"
        class="absolute top-4 right-4 text-gray-400 hover:text-white hover:bg-[#35353d] p-1.5 rounded-full transition-colors cursor-pointer"
        onclick="closeModel()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>
      <h2 id="modal-title" class="text-xl font-bold text-white mb-4">
        Ajouter un contenu
      </h2>

      <form novalidate id="formModel" class="space-y-3">
        <!-- title -->
        <div>
          <label for="show-title" class="block text-sm text-gray-300 mb-1">Titre *</label>
          <input id="show-title" type="text" required
            class="w-full px-3 py-2 rounded-lg bg-[#121214] border border-[#35353d] text-white" placeholder="Titre" />
        </div>

        <!-- description -->
        <div>
          <label for="show-description" class="block text-sm text-gray-300 mb-1">Description *</label>
          <input id="show-description" type="text" required
            class="w-full px-3 py-2 rounded-lg bg-[#121214] border border-[#35353d] text-white"
            placeholder="contenu description." />
        </div>

        <!-- type year -->
        <div class="grid grid-cols-2 gap-3">
          <!-- type -->
          <div>
            <label for="show-type" class="block text-sm text-gray-300 mb-1">Type *</label>
            <select required id="show-type" class="w-full px-3 py-2 rounded-lg bg-[#121214] border border-[#35353d] text-white">
              <option value="">-- Type --</option>
              <option value="movie">movie</option>
              <option value="series">series</option>
            </select>
          </div>

          <!-- year -->
          <div>
            <label for="field-releaseYear" class="block text-sm text-gray-300 mb-1">Année *</label>
            <input required type="number" id="show-year" min="1970" max="2026"
              class="w-full px-3 py-2 rounded-lg bg-[#121214] border border-[#35353d] text-white" placeholder="Year">
          </div>
        </div>
        <!-- img url -->
        <div>
          <label for="field-image" class="block text-sm text-gray-300 mb-1">URL image *</label>
          <input required id="show-img" type="url"
            class="w-full px-3 py-2 rounded-lg bg-[#121214] border border-[#35353d] text-white"
            placeholder="https://....">
        </div>
        <!-- duration -->
        <div id="contenu-details">
          <label for="show-duration" class="block text-sm text-gray-300 mb-1">Durée (min) *</label>
          <input required type="number" min="10" name="" id="show-duration"
            class="w-full px-3 py-2 rounded-lg bg-[#121214] border border-[#35353d] text-white" placeholder="120">
        </div>

        <!-- genner -->
        <div>
          <label for="show-genres" class="block text-sm text-gray-300 mb-1">Genres *</label>
          <input id="show-genres" type="text" required
            class="w-full px-3 py-2 rounded-lg bg-[#121214] border border-[#35353d] text-white"
            placeholder="Drama, Action" />
        </div>
        <!-- directors -->
        <div>
          <label for="show-directors" class="block text-sm text-gray-300 mb-1">Réalisateurs *</label>
          <input required id="show-directors" type="text"
            class="w-full px-3 py-2 rounded-lg bg-[#121214] border border-[#35353d] text-white"
            placeholder="Christopher Nolan" />
        </div>

        <!-- production countries -->
        <div>
          <label for="show-countries" class="block text-sm text-gray-300 mb-1">Pays de production *</label>
          <input required id="show-countries" type="text"
            class="w-full px-3 py-2 rounded-lg bg-[#121214] border border-[#35353d] text-white" placeholder="USA, UK" />
        </div>
        <!-- boutons -->

        <div class="flex gap-3 justify-end pt-2">
          <button id="btn-cancel" type="button"
            class="px-3 py-1.5 text-sm font-medium bg-[#35353d] hover:bg-[#45454f] text-white rounded cursor-pointer">
            Annuler
          </button>
          <button id="btn-submit" type="submit"
            class="px-3 py-1.5 text-sm font-medium bg-blue-600 hover:bg-blue-500 text-white rounded cursor-pointer">
            Enregistrer
          </button>

      </form>


    </div>
  </div>
  </div>
  <footer class="max-w-7xl mx-auto px-2"></footer>
  <script type="module" src="/js/admin.js"></script>
</body>

</html>
